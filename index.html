<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>世界文化漫游</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* 布局：单栏浏览页。顶部是经纬度坐标图，下面是按大洲筛选的地点卡片，卡片点开后是整屏详情。大洲用色相区分，界面本身只用墨色。 */
:root{
  --bg:#EDF1EE;
  --surface:#F8FAF8;
  --fg:#14202B;
  --muted:#53616C;
  --line:#CBD4D0;
  --focus:#2B59FF;
  --ok:#17693A;
  --ok-bg:#DDF0E3;
  --bad:#A32222;
  --bad-bg:#F6DEDC;
  --band-l:35%;
  --dot-l:42%;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151B;
    --surface:#161E26;
    --fg:#E7ECEF;
    --muted:#9BA8B2;
    --line:#2A3641;
    --focus:#8EA6FF;
    --ok:#7DD39E;
    --ok-bg:#16301F;
    --bad:#FF9C95;
    --bad-bg:#3A1C1B;
    --band-l:32%;
    --dot-l:62%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B;
  --surface:#161E26;
  --fg:#E7ECEF;
  --muted:#9BA8B2;
  --line:#2A3641;
  --focus:#8EA6FF;
  --ok:#7DD39E;
  --ok-bg:#16301F;
  --bad:#FF9C95;
  --bad-bg:#3A1C1B;
  --band-l:32%;
  --dot-l:62%;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--fg);
  font:400 16px/1.7 var(--f-body);
  padding-block:24px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:500 13px/1.4 var(--f-body);letter-spacing:.12em;color:var(--muted)}

.btn{
  font:500 15px/1 var(--f-body);
  padding:13px 18px;min-height:44px;
  border-radius:3px;border:1px solid var(--fg);
  background:var(--fg);color:var(--bg);cursor:pointer;
}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.sm{padding:9px 14px;min-height:40px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px}

/* 顶部 */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:center}
@media (min-width:900px){.hero{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px}}
.hero-text{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-width:0}
.hero h1{font-size:clamp(42px,11.5vw,88px);font-weight:900;line-height:1.05;letter-spacing:.02em}
.lead{font-size:18px;max-width:28em}

.atlas{margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.atlas svg{width:100%;height:auto;display:block}
.g-line{stroke:var(--line);stroke-width:1;fill:none}
.g-eq{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;fill:none}
.g-lab{font:400 10px var(--f-mono);fill:var(--muted)}
@media (max-width:600px){.g-lab{display:none}}
.pin{cursor:pointer;outline:none}
.pin .hit{fill:transparent}
.pin .dot{fill:hsl(var(--h) 62% var(--dot-l));stroke:var(--bg);stroke-width:1.5}
.pin .ring{fill:none;stroke:var(--fg);stroke-width:1.5;opacity:0;transition:opacity .15s}
.pin.on .ring,.pin:focus-visible .ring{opacity:1}
.cap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;border-top:1px solid var(--line);padding-top:12px}
.cap-l{min-width:0}
.cap-name{font:700 20px/1.3 var(--f-display)}
.cap-c{font:400 13px var(--f-body);color:var(--muted);margin-left:10px}
.cap-meta{font:400 12px/1.6 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}

.sun{display:inline-block;width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;margin-right:5px}
.sun.day{background:currentColor}

/* 章节标题 */
.sec-head{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.sec-head h2{font-size:clamp(26px,5vw,36px);font-weight:900}
.sec-head p{color:var(--muted);max-width:36em}

/* 今日一句 */
.daily{
  display:grid;grid-template-columns:minmax(0,1fr);gap:20px;
  border:1px solid var(--line);background:var(--surface);
  border-radius:4px;padding:22px 18px;
}
@media (min-width:760px){.daily{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:center;padding:30px}}
.daily-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.daily-greet{font:500 clamp(40px,9vw,72px)/1.15 var(--f-body);overflow-wrap:anywhere}
.daily-roman{font:400 15px var(--f-mono);color:var(--muted)}
.daily-mean{margin-top:6px}
.daily-side{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-width:0}
.daily-from{font:700 18px/1.4 var(--f-display)}
.daily-from small{display:block;font:400 12px var(--f-mono);color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}

/* 筛选与卡片 */
.filters{display:flex;flex-wrap:wrap;gap:8px}
#filters{margin-bottom:20px}
.chip{
  font:500 14px/1 var(--f-body);
  padding:10px 14px;min-height:40px;
  border:1px solid var(--line);background:transparent;color:var(--fg);
  border-radius:999px;cursor:pointer;
}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font:400 12px var(--f-mono);margin-left:6px;opacity:.7}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{
  display:flex;flex-direction:column;text-align:left;
  padding:0;min-width:0;overflow:hidden;
  border:1px solid var(--line);background:var(--surface);color:inherit;
  font:inherit;cursor:pointer;border-radius:4px;
  transition:transform .15s,border-color .15s;
}
.card:hover{transform:translateY(-2px);border-color:var(--fg)}

.band{
  --b:hsl(var(--h) 48% var(--band-l));
  --t:hsl(var(--h) 48% calc(var(--band-l) + 9%));
  display:flex;justify-content:space-between;align-items:flex-end;gap:8px;
  min-height:76px;padding:10px 12px;
  background-color:var(--b);color:#fff;
}
.tag{
  display:inline-flex;align-items:center;
  font:500 12px/1 var(--f-mono);font-variant-numeric:tabular-nums;
  background:var(--b);color:#fff;padding:5px 7px;border-radius:2px;
}
.p-stripes{background-image:repeating-linear-gradient(135deg,var(--t) 0 6px,transparent 6px 14px)}
.p-dots{background-image:radial-gradient(var(--t) 2px,transparent 2.5px);background-size:12px 12px}
.p-grid{background-image:linear-gradient(var(--t) 1px,transparent 1px),linear-gradient(90deg,var(--t) 1px,transparent 1px);background-size:14px 14px}
.p-rings{background-image:repeating-radial-gradient(circle at 85% 120%,var(--t) 0 3px,transparent 3px 12px)}
.p-zig{background-image:linear-gradient(135deg,var(--t) 25%,transparent 25%),linear-gradient(225deg,var(--t) 25%,transparent 25%);background-size:16px 16px}
.p-diamond{background-image:linear-gradient(45deg,var(--t) 25%,transparent 25%,transparent 75%,var(--t) 75%),linear-gradient(45deg,var(--t) 25%,transparent 25%,transparent 75%,var(--t) 75%);background-size:20px 20px;background-position:0 0,10px 10px}

.cbody{display:flex;flex-direction:column;gap:4px;padding:14px 14px 16px}
.cgreet{font:500 28px/1.25 var(--f-body);overflow-wrap:anywhere}
.cname{font:700 19px/1.3 var(--f-display);margin-top:4px}
.cmeta{font-size:13px;line-height:1.5;color:var(--muted)}
.cfacts{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}
.cfacts b{font:500 12px var(--f-body);letter-spacing:.08em;color:var(--muted);margin-right:8px}

/* 详情 */
.sheet{
  position:fixed;inset:0;z-index:50;
  background:rgba(10,16,22,.55);
  display:flex;justify-content:center;align-items:stretch;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
.panel{
  background:var(--bg);width:100%;max-width:760px;
  overflow-y:auto;overscroll-behavior:contain;
  padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  animation:rise .22s ease-out;
}
@media (min-width:800px){
  .sheet{padding:24px}
  .panel{border-radius:4px;border:1px solid var(--line)}
}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sbar{
  position:sticky;top:0;z-index:2;
  display:flex;justify-content:space-between;gap:8px;
  padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);
}
.snav{display:flex;gap:8px}
.sband{min-height:120px}
.sbody{display:flex;flex-direction:column;gap:14px;padding:24px 16px 8px}
@media (min-width:800px){.sbody{padding:28px 28px 8px}}
.stitle{font-size:clamp(32px,7vw,48px);font-weight:900;line-height:1.15;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.native{font:400 18px var(--f-body);color:var(--muted)}
.sgreet{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:18px}
.g-text{font:500 clamp(34px,8vw,56px)/1.2 var(--f-body);overflow-wrap:anywhere}
.g-roman{font:400 15px var(--f-mono);color:var(--muted)}
.sgreet p{margin-top:6px}
.facts{margin:8px 0 0}
.facts>div{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:16px 0;border-top:1px solid var(--line)}
@media (min-width:620px){.facts>div{grid-template-columns:110px minmax(0,1fr)}}
.facts dt{font:700 13px/1.8 var(--f-body);letter-spacing:.12em;color:var(--muted)}
.facts dd{margin:0;min-width:0}
.f-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-bottom:4px}
.f-n{font:700 20px/1.4 var(--f-display)}
.f-w{font:400 13px var(--f-mono);color:var(--muted)}

/* 小测验 */
.quiz{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
@media (min-width:760px){.quiz{padding:28px}}
.q-prog{display:flex;gap:6px}
.seg{flex:1;height:4px;background:var(--line)}
.seg.done{background:var(--fg)}
.q-text{font:700 clamp(20px,4.5vw,26px)/1.45 var(--f-display)}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:640px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{
  text-align:left;padding:14px 16px;min-height:48px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);
  font:500 16px/1.4 var(--f-body);border-radius:3px;cursor:pointer;
}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt:disabled{cursor:default;color:var(--fg)}
.opt:disabled:not(.right):not(.wrong){opacity:.6}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.fb{display:flex;flex-direction:column;gap:4px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:3px}
.quiz .btn{align-self:flex-start}
.q-score{font:900 clamp(48px,12vw,80px)/1 var(--f-display)}
.q-score span{font:400 20px var(--f-mono);color:var(--muted)}

.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-text">
      <p class="eyebrow" id="count">各地文化</p>
      <h1>世界文化漫游</h1>
      <p class="lead">挑一个地方，学一句当地话，看看那里的节日、食物和手艺。</p>
      <div class="actions">
        <button type="button" class="btn" id="start">开始浏览</button>
        <button type="button" class="btn ghost" id="rand">随机去一个地方</button>
      </div>
    </div>
    <figure class="atlas">
      <svg id="atlasSvg" viewBox="-16 -12 752 272" role="group" aria-label="各地经纬度坐标图"></svg>
      <figcaption class="cap" id="cap" aria-live="polite"></figcaption>
    </figure>
  </header>

  <section class="daily" id="daily" aria-label="今日一句"></section>

  <section id="browse" aria-labelledby="browse-h">
    <div class="sec-head">
      <h2 id="browse-h">挑一个地方</h2>
      <p>按大洲筛选，点开卡片看节日、美食、手艺和当地礼仪。</p>
    </div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="quiz" aria-labelledby="quiz-h">
    <div class="sec-head">
      <h2 id="quiz-h">小测验</h2>
      <p>5 题，看看刚才记住了多少。</p>
    </div>
    <div class="quiz" id="quizBox" aria-live="polite"></div>
  </section>

  <footer class="foot">资料为简要介绍，节日日期以当地公布为准。当地时间按各地时区实时计算。</footer>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="panel" id="panel"></div>
</div>

<script>
(function(){
"use strict";

var CONT=[
  {id:"asia",name:"亚洲",h:350},
  {id:"europe",name:"欧洲",h:215},
  {id:"africa",name:"非洲",h:38},
  {id:"america",name:"美洲",h:158},
  {id:"oceania",name:"大洋洲",h:272}
];

var PLACES=[
  {id:"kyoto",c:"asia",place:"京都",country:"日本",native:"京都",lang:"ja",lat:35.01,lon:135.77,tz:"Asia/Tokyo",pat:"rings",
   g:{t:"こんにちは",r:"konnichiwa",m:"你好，白天使用的问候语。"},
   fest:{n:"祇园祭",w:"每年7月",d:"八坂神社的祭礼，整个7月举行，中旬的山鉾巡行最热闹，装饰华丽的花车会缓缓走过街道。"},
   food:{n:"怀石料理",d:"京都的怀石料理按季节安排食材，一道一道上菜。附近的宇治出产抹茶，常配和果子一起吃。"},
   craft:{n:"西阵织",d:"京都西阵一带织造的高级丝织品，图案精细，常用在和服和腰带上。"},
   tip:"进入铺着榻榻米的房间要先脱鞋，拖鞋也不要穿上榻榻米。",
   fact:"从794年建都平安京起，京都做了一千多年的日本都城。"},

  {id:"jaipur",c:"asia",place:"斋浦尔",country:"印度",native:"जयपुर",lang:"hi",lat:26.91,lon:75.79,tz:"Asia/Kolkata",pat:"diamond",
   g:{t:"नमस्ते",r:"namaste",m:"你好。双手合十放在胸前，微微低头。"},
   fest:{n:"排灯节（Diwali）",w:"通常在10月到11月",d:"以灯火庆祝光明战胜黑暗。家家点油灯、放烟花，互赠甜点。"},
   food:{n:"达尔巴蒂（Dal Baati Churma）",d:"拉贾斯坦邦的代表菜，烤小面团配扁豆汤，再配一份拌了糖和酥油的碎面团。"},
   craft:{n:"木版印花布",d:"用雕刻的木模蘸染料，一下一下盖印在棉布上。斋浦尔近郊的桑加内尔以此闻名。"},
   tip:"用右手吃饭和递东西更得体，左手在传统里被视为不洁。",
   fact:"斋浦尔老城被称为“粉红之城”。1876年为迎接来访的英国王储，城里的建筑被刷成了粉红色。"},

  {id:"chiangmai",c:"asia",place:"清迈",country:"泰国",native:"เชียงใหม่",lang:"th",lat:18.79,lon:98.98,tz:"Asia/Bangkok",pat:"dots",
   g:{t:"สวัสดี",r:"sawatdee",m:"你好。男生句尾加 khrap，女生加 kha。"},
   fest:{n:"水灯节与天灯节",w:"通常在11月",d:"农历十二月的月圆前后，人们把天灯放上夜空，也把小水灯放进河里，寄托心愿。"},
   food:{n:"康托克面（Khao Soi）",d:"泰北名菜，椰奶咖喱汤里放鸡蛋面，上面撒一把炸脆的面条。"},
   craft:{n:"播桑伞",d:"清迈东郊的播桑村以手工纸伞闻名，每年1月有伞节，街上摆满彩绘的伞。"},
   tip:"见面行合十礼（wai），不要摸别人的头，也不要用脚指向人或物。",
   fact:"清迈建于1296年，曾是兰纳王国的都城。"},

  {id:"jeonju",c:"asia",place:"全州",country:"韩国",native:"전주",lang:"ko",lat:35.82,lon:127.15,tz:"Asia/Seoul",pat:"grid",
   g:{t:"안녕하세요",r:"annyeonghaseyo",m:"您好，比较礼貌的问候，初次见面和对长辈都能用。"},
   fest:{n:"秋夕（Chuseok）",w:"农历八月十五",d:"韩国的中秋。家人团聚、祭拜祖先，一起做半月形的松饼（songpyeon）。"},
   food:{n:"全州拌饭（Bibimbap）",d:"米饭上铺各种时蔬、牛肉和鸡蛋，加辣酱拌匀。全州是拌饭最有名的城市之一。"},
   craft:{n:"韩纸（Hanji）",d:"用楮树皮制成的传统纸，结实耐用。全州的韩纸工艺很有名，可以做灯、盒子和窗纸。"},
   tip:"和长辈同桌时，等长辈先动筷；递东西或接东西时用双手。",
   fact:"全州韩屋村保留了约700座传统韩屋。"},

  {id:"chengdu",c:"asia",place:"成都",country:"中国",native:"成都",lang:"zh-CN",lat:30.57,lon:104.07,tz:"Asia/Shanghai",pat:"zig",qx:["g"],
   g:{t:"你好",r:"nǐ hǎo",m:"成都人常说“巴适”，意思是舒服、恰到好处。"},
   fest:{n:"春节庙会",w:"农历正月",d:"春节期间，武侯祠、青羊宫等地举办庙会，有灯会、小吃和民俗表演。"},
   food:{n:"火锅与担担面",d:"牛油红汤火锅以麻辣闻名；担担面用花椒、红油和芽菜调味。"},
   craft:{n:"蜀锦",d:"成都的传统丝织锦缎，已有两千多年历史，色彩浓艳，图案繁复。"},

var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var byId=function(id){return PLACES.filter(function(p){return p.id===id;})[0];};
var contOf=function(p){return CONT.filter(function(c){return c.id===p.c;})[0];};
var coord=function(p){
  return Math.abs(p.lat).toFixed(2)+"°"+(p.lat>=0?"N":"S")+" "+Math.abs(p.lon).toFixed(2)+"°"+(p.lon>=0?"E":"W");
};
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

/* 当地时间 */
var fmts={};
function clockFor(tz){
  try{
    var f=fmts[tz]||(fmts[tz]=new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}));
    var h=0,m="00";
    f.formatToParts(new Date()).forEach(function(x){
      if(x.type==="hour")h=parseInt(x.value,10);
      if(x.type==="minute")m=x.value;
    });
    return {text:(h<10?"0":"")+h+":"+m,day:h>=6&&h<18};
  }catch(e){
    return {text:"--:--",day:true};
  }
}
function updateClocks(){
  $$("[data-tz]").forEach(function(n){
    var c=clockFor(n.getAttribute("data-tz"));
    var t=n.querySelector("time");
    if(t)t.textContent=c.text;
    var s=n.querySelector(".sun");
    if(s)s.classList.toggle("day",c.day);
    n.title="当地时间，"+(c.day?"白天":"夜晚");
  });
}
function clockTag(tz){
  return '<span class="tag" data-tz="'+tz+'"><i class="sun"></i><time>--:--</time></span>';
}

/* 状态 */
var filter="all";
var currentId=null;
var lastFocus=null;
var quiz=null;
var sheet=$("#sheet"),panel=$("#panel");

function dayIndex(){
  var d=new Date();
  return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
}
var dailyId=PLACES[dayIndex()%PLACES.length].id;

/* 坐标图 */
function renderAtlas(){
  var W=720,H=240,s="";
  s+='<rect class="g-line" x="0" y="0" width="'+W+'" height="'+H+'"/>';
  for(var lon=-150;lon<=150;lon+=30){
    var x=(lon+180)*2;
    s+='<line class="g-line" x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'"/>';
  }
  [60,30,-30].forEach(function(lat){
    var y=(70-lat)*2;
    s+='<line class="g-line" x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'"/>';
  });
  s+='<line class="g-eq" x1="0" y1="140" x2="'+W+'" y2="140"/>';
  [[60,"60°N"],[30,"30°N"],[0,"0°"],[-30,"30°S"]].forEach(function(r){
    s+='<text class="g-lab" x="4" y="'+((70-r[0])*2-4)+'">'+r[1]+'</text>';
  });
  [-120,-60,0,60,120].forEach(function(lon){
    var t=Math.abs(lon)+"°"+(lon<0?"W":lon>0?"E":"");
    s+='<text class="g-lab" text-anchor="middle" x="'+((lon+180)*2)+'" y="254">'+t+'</text>';
  });
  PLACES.forEach(function(p){
    var x=(p.lon+180)*2,y=(70-p.lat)*2;
    s+='<g class="pin" data-id="'+p.id+'" style="--h:'+contOf(p).h+'" tabindex="0" role="button" aria-label="'+p.place+'，'+p.country+'" transform="translate('+x+' '+y+')">'+
       '<circle class="hit" r="14"/><circle class="ring" r="11"/><circle class="dot" r="6"/></g>';
  });
  $("#atlasSvg").innerHTML=s;
}
function selectPin(id){
  $$(".pin").forEach(function(g){g.classList.toggle("on",g.getAttribute("data-id")===id);});
  var p=byId(id),c=contOf(p);
  $("#cap").innerHTML=
    '<div class="cap-l"><div class="cap-name">'+p.place+'<span class="cap-c">'+p.country+' · '+c.name+'</span></div>'+
    '<div class="cap-meta">'+coord(p)+' · 当地 <span data-tz="'+p.tz+'"><i class="sun"></i><time>--:--</time></span></div></div>'+
    '<button type="button" class="btn sm" data-open="'+p.id+'">打开</button>';
  updateClocks();
}

  var items=[{id:"all",name:"全部",n:PLACES.length}].concat(CONT.map(function(c){

  }));
  $("#filters").innerHTML=items.map(function(i){

}

  var head=name?'<div class="f-head"><span class="f-n">'+name+'</span>'+(when?'<span class="f-w">'+when+'</span>':'')+'</div>':'';
  return '<div><dt>'+label+'</dt><dd>'+head+'<p>'+text+'</p></dd></div>';

  var c=contOf(p);
  return '<div class="sbar">'+
      '<button type="button" class="btn ghost sm" data-act="close">关闭</button>'+

    '</div>'+
    '<div class="band sband p-'+p.pat+'" style="--h:'+c.h+'"><span class="tag">'+coord(p)+'</span>'+clockTag(p.tz)+'</div>'+
    '<div class="sbody">'+
      '<p class="eyebrow">'+c.name+' · '+p.country+'</p>'+
      '<h2 class="stitle" id="sTitle">'+p.place+(p.native!==p.place?'<span class="native" lang="'+p.lang+'">'+p.native+'</span>':'')+'</h2>'+
      '<div class="sgreet"><div class="g-text" lang="'+p.lang+'">'+p.g.t+'</div><div class="g-roman">'+p.g.r+'</div><p>'+p.g.m+'</p></div>'+
      '<dl class="facts">'+
        row("节日",p.fest.n,p.fest.w,p.fest.d)+
        row("美食",p.food.n,"",p.food.d)+
        row("手艺",p.craft.n,"",p.craft.d)+
        row("入乡随俗","","",p.tip)+
        row("你知道吗","","",p.fact)+
      '</dl>'+
    '</div>';
}
function showSheet(id){
  currentId=id;
  panel.innerHTML=sheetHTML(byId(id));
  panel.scrollTop=0;
  updateClocks();
}
function openSheet(id){
  lastFocus=document.activeElement;
  showSheet(id);
  sheet.hidden=false;
  document.documentElement.style.overflow="hidden";
  var b=$('[data-act="close"]',panel);
  if(b)b.focus();
}
function closeSheet(){
  sheet.hidden=true;
  document.documentElement.style.overflow="";
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
function step(dir,act){
  var v=visible();
  var list=v.some(function(p){return p.id===currentId;})?v:PLACES;
  var i=0;
  list.forEach(function(p,k){if(p.id===currentId)i=k;});
  showSheet(list[(i+dir+list.length)%list.length].id);
  if(act){var b=$('[data-act="'+act+'"]',panel);if(b)b.focus();}
}

/* 小测验 */
function buildQ(kind,p){
  var text,expl;
  if(kind==="g"){text="“"+p.g.t+"”（"+p.g.r+"）是哪里的问候语？";expl=p.g.m;}
  if(kind==="f"){text="“"+p.fest.n+"”是哪里的节日？";expl=p.fest.w+"。"+p.fest.d;}
  if(kind==="d"){text="“"+p.food.n+"”是哪里的代表美食？";expl=p.food.d;}
  if(kind==="c"){text="“"+p.craft.n+"”是哪里的传统手艺？";expl=p.craft.d;}
  var others=shuffle(PLACES.filter(function(x){return x.id!==p.id;})).slice(0,3);
  return {
    text:text,expl:expl,answer:p.id,
    opts:shuffle([p].concat(others)).map(function(o){return {id:o.id,label:o.country+"·"+o.place};})
  };
}
function newQuiz(){
  var pool=[];
  PLACES.forEach(function(p){
    ["g","f","d","c"].forEach(function(k){
      if((p.qx||[]).indexOf(k)<0)pool.push({k:k,p:p});
    });
  });
  var qs=[],used={};
  shuffle(pool).forEach(function(it){
    if(qs.length>=5||used[it.p.id])return;
    used[it.p.id]=1;
    qs.push(buildQ(it.k,it.p));
  });
  quiz={qs:qs,i:0,score:0,answered:null,wrong:[]};
}
function renderQuiz(){
  var box=$("#quizBox"),n=quiz.qs.length;
  if(quiz.i>=n){
    var msg=quiz.score>=4?"记得很牢。":quiz.score>=2?"记住了一部分，回到卡片再看看。":"还不熟，翻几张卡片再来一轮。";
    var wrong=quiz.wrong.map(function(id){
      return '<button type="button" class="chip" data-open="'+id+'">'+byId(id).place+'</button>';
    }).join("");
    box.innerHTML='<p class="eyebrow">本轮结果</p>'+
      '<p class="q-score">'+quiz.score+'<span> / '+n+'</span></p>'+
      '<p>'+msg+'</p>'+
      (wrong?'<p class="eyebrow">答错的地方，点开再看看</p><div class="filters">'+wrong+'</div>':'')+
      '<button type="button" class="btn" data-restart>再来一轮</button>';
    return;
  }
  var q=quiz.qs[quiz.i],a=quiz.answered,segs="";
  for(var k=0;k<n;k++){
    segs+='<span class="seg'+((k<quiz.i||(k===quiz.i&&a))?' done':'')+'"></span>';
  }
  var opts=q.opts.map(function(o){
    var cls="opt";
    if(a){
      if(o.id===q.answer)cls+=" right";
      else if(o.id===a)cls+=" wrong";
    }
    return '<button type="button" class="'+cls+'" data-id="'+o.id+'"'+(a?' disabled':'')+'>'+o.label+'</button>';
  }).join("");
  var fb="";
  if(a){
    var ok=a===q.answer;
    var right=q.opts.filter(function(o){return o.id===q.answer;})[0].label;
    fb='<div class="fb"><p><strong>'+(ok?"答对了。":"答错了，正确答案是 "+right+"。")+'</strong></p><p>'+q.expl+'</p></div>'+
       '<button type="button" class="btn" data-next>'+(quiz.i===n-1?"看结果":"下一题")+'</button>';
  }
  box.innerHTML='<div class="q-prog" aria-hidden="true">'+segs+'</div>'+
    '<p class="eyebrow">第 '+(quiz.i+1)+' / '+n+' 题</p>'+
    '<p class="q-text">'+q.text+'</p>'+
    '<div class="opts">'+opts+'</div>'+fb;
}

/* 事件 */
document.addEventListener("click",function(e){
  var t=e.target;
  if(!t.closest)return;

  var op=t.closest("[data-open]");
  if(op){openSheet(op.getAttribute("data-open"));return;}

  var act=t.closest("[data-act]");
  if(act){
    var a=act.getAttribute("data-act");
    if(a==="close")closeSheet();
    if(a==="prev")step(-1,"prev");
    if(a==="next")step(1,"next");
    return;
  }

  var pin=t.closest(".pin");
  if(pin){selectPin(pin.getAttribute("data-id"));return;}

  var fl=t.closest("[data-filter]");
  if(fl){filter=fl.getAttribute("data-filter");renderFilters();renderGrid();return;}

  if(t.closest("[data-shuffle]")){
    var n;
    do{n=PLACES[Math.floor(Math.random()*PLACES.length)].id;}while(n===dailyId);
    dailyId=n;renderDaily();selectPin(n);return;
  }

  var opt=t.closest(".opt");
  if(opt&&!opt.disabled){
    var q=quiz.qs[quiz.i],id=opt.getAttribute("data-id");
    quiz.answered=id;
    if(id===q.answer)quiz.score++;else quiz.wrong.push(q.answer);
    renderQuiz();
    var nb=$("[data-next]",$("#quizBox"));
    if(nb)nb.focus();
    return;
  }
  if(t.closest("[data-next]")){quiz.i++;quiz.answered=null;renderQuiz();return;}
  if(t.closest("[data-restart]")){newQuiz();renderQuiz();return;}

  if(t.closest("#start")){$("#browse").scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(t.closest("#rand")){openSheet(PLACES[Math.floor(Math.random()*PLACES.length)].id);return;}
});

sheet.addEventListener("click",function(e){if(e.target===sheet)closeSheet();});

document.addEventListener("keydown",function(e){
  var pin=e.target.closest&&e.target.closest(".pin");
  if(pin&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();
    selectPin(pin.getAttribute("data-id"));
    return;
  }
  if(sheet.hidden)return;
  if(e.key==="Escape"){closeSheet();return;}
  if(e.key==="ArrowLeft"){step(-1);return;}
  if(e.key==="ArrowRight"){step(1);return;}
  if(e.key==="Tab"){
    var f=$$("button,[href],[tabindex]:not([tabindex='-1'])",panel).filter(function(x){return !x.disabled;});
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});

/* 启动 */
$("#count").textContent="已收录 "+PLACES.length+" 个地方 · "+CONT.length+" 个大洲";
renderAtlas();
selectPin(dailyId);
renderDaily();
renderFilters();
renderGrid();
newQuiz();
renderQuiz();
updateClocks();
setInterval(updateClocks,30000);
})();
</script>
