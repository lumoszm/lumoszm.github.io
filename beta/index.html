var placesP=null;
function loadPlaces(){
  if(placesP)return placesP;
  placesP=(window.__ATLAS_CITIES?Promise.resolve(window.__ATLAS_CITIES):fetch("cities.json").then(function(r){if(!r.ok)throw new Error("cities");return r.json();}))
  .then(function(d){
    C.TZ=d.tz;C.CC=d.cc;var P=[],PI={};
    d.c.split("\n").forEach(function(l){
      var f=l.split("\t"),cc=f[5],tzi=f[6]===""||f[6]===undefined?(d.cc[cc]?d.cc[cc][3]:-1):+f[6];
      var o={id:"g"+f[0],zh:f[1]||f[2],en:f[2],lat:+f[3],lon:+f[4],cc:cc,tz:d.tz[tzi]||"UTC",pc:+f[7]||0,k:"c",alt:f[8]||""};
      P.push(o);PI[o.id]=o;
    });
    d.p.forEach(function(f){var o={id:f[0],zh:f[1],en:f[2],lat:f[3],lon:f[4],cc:f[5],tz:d.tz[f[6]]||"UTC",pc:5,k:f[7],alt:f[8]||""};P.push(o);PI[o.id]=o;});
    C.P=P;C.PI=PI;
    placesIntoSearch();
    if(C.ov.length)refreshPins();
    return P;
  }).catch(function(e){placesP=null;throw e;});
  return placesP;
}
function place(id){
  var p=C.PI[id];if(p)return p;
  var o=C.ovById[id];
  if(o)return {id:id,zh:o.city_zh||o.city_en,en:o.city_en||o.city_zh,lat:o.clat,lon:o.clng,cc:o.cc,tz:(C.CC[o.cc]&&C.TZ[C.CC[o.cc][3]])||"UTC",k:"c",pc:4};
  return null;
}
function pName(p){return p?(LANG==="en"?p.en:p.zh):"";}
function pOther(p){var a=LANG==="en"?p.zh:p.en;return a&&a!==pName(p)?a:"";}
function ccName(cc){var c=C.CC[cc];return c?(LANG==="en"?c[1]:c[0]):(cc||"");}
function pSub(p){return [p.k==="p"?tr("landmark"):p.k==="n"?tr("nature"):"",ccName(p.cc)].filter(Boolean).join(" · ");}
function rowCity(r){var p=C.PI[r.city_id];return p?pName(p):(LANG==="en"?(r.city_en||r.city_zh):(r.city_zh||r.city_en));}
function hav(a,b,c,d){var x=Math.sin((c-a)*RAD/2),y=Math.sin((d-b)*RAD/2),h=x*x+Math.cos(a*RAD)*Math.cos(c*RAD)*y*y;return 12742*Math.asin(Math.min(1,Math.sqrt(h)));}
/* 按拍摄位置挑城市：距离近、城市大的优先；地标在 2.5 公里内时优先 */
function nearPlaces(lat,lon,n){
  if(!C.P)return [];
  var out=[],cl=Math.max(Math.cos(lat*RAD),0.05);
  for(var i=0;i<C.P.length;i++){
    var p=C.P[i];if(Math.abs(p.lat-lat)>0.9||Math.abs(wrap(p.lon-lon))*cl>0.9)continue;
    var d=hav(lat,lon,p.lat,p.lon);
    if(p.k==="n")continue;
    if(p.k==="p"){if(d<2.5)out.push({p:p,d:d,s:-1+d/10});continue;}
    if(d<70)out.push({p:p,d:d,s:d/(1+0.4*Math.max(0,p.pc-3))});
  }
  out.sort(function(a,b){return a.s-b.s;});
  return out.slice(0,n||6);
}
function placesIntoSearch(){
  for(var i=IDX.length-1;i>=0;i--){var e=IDX[i];if(e.k==="c"||e.k==="a")IDX.splice(i,1);}
  var byEn={};C.P.forEach(function(p){if(p.k!=="c")byEn[p.en]=p;});
  IDX.forEach(function(e){if((e.k==="p"||e.k==="n")&&byEn[e.en])e.cid=byEn[e.en].id;});
  C.P.forEach(function(p){
    if(p.k!=="c")return;
    addIdx({k:"c",zh:p.zh,en:p.en,lat:p.lat,lon:p.lon,z:3.0,cid:p.id,cc:p.cc},p.alt);
    IDX[IDX.length-1].boost=3+p.pc;
  });
}
function placeSearch(q,n){
  var nq=qnorm(q);if(!nq||!C.P)return [];
  var out=[];
  for(var i=0;i<IDX.length;i++){
    var e=IDX[i];if(!e.cid)continue;
    var best=0;
    for(var j=0;j<e.keys.length;j++){
      var k=e.keys[j];
      if(k===nq)best=Math.max(best,100);
      else if(k.indexOf(nq)===0)best=Math.max(best,80-Math.min(20,(k.length-nq.length)*0.6));
      else if(nq.length>=2&&k.indexOf(nq)>0)best=Math.max(best,46);
    }
    if(best>0)out.push({p:C.PI[e.cid],s:best+e.boost});
  }
  out.sort(function(a,b){return b.s-a.s;});
  var seen={},res=[];
  for(var k=0;k<out.length&&res.length<(n||8);k++){if(out[k].p&&!seen[out[k].p.id]){seen[out[k].p.id]=1;res.push(out[k].p);}}
  return res;
}

var fromLink=/(^|[#&])(access_token|error_code)=/.test(location.hash||"")?(/error_code=/.test(location.hash)?"bad":"ok"):"";
function initSB(){
  if(!window.supabase||!/^https?:\/\//.test(CFG.url)||!CFG.key||CFG.key.indexOf("@@")===0)return;
  try{
    C.sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit",storageKey:"atlas-auth"}});
  }catch(e){C.sb=null;return;}
  C.sb.auth.onAuthStateChange(function(ev,session){
    var was=C.session&&C.session.user&&C.session.user.id;
    C.session=session;
    var now=session&&session.user&&session.user.id;
    if(was!==now||ev==="USER_UPDATED")setTimeout(loadMe,0);
  });
}
var meP=null;
function loadMe(){
  if(!cOK())return Promise.resolve(null);
  meP=C.sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session;C.session=s;
    if(!s){C.me=null;C.liked={};meChanged();
      if(fromLink){fromLink="";if(/error_code=/.test(location.hash))try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}setTimeout(function(){if(!mOn()){authOpen();aErr(tr("linkBad"));}},600);}
      return null;}
    return C.sb.from("profiles").select("*").eq("id",s.user.id).maybeSingle().then(function(q){
      C.me=q.data||{id:s.user.id,name:""};meChanged();
      /* 在另一个页面点了邮件里的链接登录：发送邮件前已经勾选过同意，这里补记 */
      var pend=0;try{pend=+localStorage.getItem("atlas-consent")||0;}catch(e){}
      var need=!C.me.terms_at||!C.me.xborder_at;
      var p2=need&&pend&&Date.now()-pend<3*3600e3?consentSave().then(function(){try{localStorage.removeItem("atlas-consent");}catch(e){}}):Promise.resolve();
      return p2.then(function(){
        if(mOn("auth")&&(A.step==="code"||A.step==="email")&&!A.busy){if(C.me.terms_at&&C.me.xborder_at)authAfter();else authStep("agree");}
        else if(fromLink==="ok"&&!mOn()){fromLink="";if(!C.me.terms_at||!C.me.xborder_at||!C.me.name)authOpen();else toast(trf("signedIn",uname(C.me)),2200);}

function pinSource(){
  var by={},out=[];

    var p=C.PI[id],q=by[id];
    if(!q){q=by[id]={id:id,lat:p?p.lat:lat,lon:p?p.lon:lon,name:p?pName(p):(LANG==="en"?en||zh:zh||en),cc:p?p.cc:cc,pc:p?(p.pc||3):3,n:0,img:""};out.push(q);}
    q.n+=n;if(!q.img&&img)q.img=img;
  }
  var cur=(typeof CUR!=="undefined"&&CUR.p)||{};
  Object.keys(cur).forEach(function(id){
    var a=cur[id];if(!a.length)return;var p=C.PI[id];if(!p)return;
    var s=a.filter(function(x){return x[1]==="s";})[0]||a[0];
    add(id,curPath(s,true),a.length);

/* 足迹连线：在地球上画出按时间先后连接的大圆弧 */
var arcC=null,arcX=null,arcOn=false;
function drawArcs(VP,eye,now){
  if(!arcC){arcC=$("#arcs");if(!arcC)return;arcX=arcC.getContext("2d");}
  var fp=C.fp,on=!!(fp&&fp.list.length>1&&S.layoutE>0.7);
  var W=S.W,H=S.H,dpr=S.dpr;
  if(arcC.width!==Math.round(W*dpr)||arcC.height!==Math.round(H*dpr)){arcC.width=Math.round(W*dpr);arcC.height=Math.round(H*dpr);}
  if(!on){if(arcOn){arcX.clearRect(0,0,arcC.width,arcC.height);arcOn=false;}return;}
  arcOn=true;arcX.clearRect(0,0,arcC.width,arcC.height);
  var n=fp.list.length,prog=reduced()?1:Math.min(1,(now-fp.t0)/(900+n*260));
  arcX.lineCap="round";arcX.lineJoin="round";
  var ex=eye[0],ey=eye[1],ez=eye[2],ee=ex*ex+ey*ey+ez*ez-1;
  function proj(x,y,z){
    var cw=VP[3]*x+VP[7]*y+VP[11]*z+VP[15];if(cw<=0)return null;
    var dx=x-ex,dy=y-ey,dz=z-ez,a=dx*dx+dy*dy+dz*dz,b=ex*dx+ey*dy+ez*dz,disc=b*b-a*ee;
    if(disc>0){var t1=(-b-Math.sqrt(disc))/a;if(t1>0.0001&&t1<0.999)return null;}
    return [((VP[0]*x+VP[4]*y+VP[8]*z+VP[12])/cw*.5+.5)*W*dpr,(.5-(VP[1]*x+VP[5]*y+VP[9]*z+VP[13])/cw*.5)*H*dpr];
  }
  for(var i=0;i<n-1;i++){
    var pi=clamp(prog*(n-1)-i,0,1);if(pi<=0)break;
    var a=llv(fp.list[i].lat,fp.list[i].lon),b=llv(fp.list[i+1].lat,fp.list[i+1].lon);
    var dt=clamp(a[0]*b[0]+a[1]*b[1]+a[2]*b[2],-1,1),ang=Math.acos(dt);if(ang<0.0015)continue;
    var so=Math.sin(ang),seg=Math.max(10,Math.ceil(ang*70)),h=0.006+0.16*ang/Math.PI;
    var pts=[];
    for(var k=0;k<=seg*pi+0.001;k++){
      var t=Math.min(k/seg,pi),wa=Math.sin((1-t)*ang)/so,wb=Math.sin(t*ang)/so,r=1+h*Math.sin(Math.PI*t);
      pts.push(proj((a[0]*wa+b[0]*wb)*r,(a[1]*wa+b[1]*wb)*r,(a[2]*wa+b[2]*wb)*r));
    }
    for(var pass=0;pass<2;pass++){
      arcX.beginPath();var pen=false;
      for(var q=0;q<pts.length;q++){var P=pts[q];if(!P){pen=false;continue;}if(!pen){arcX.moveTo(P[0],P[1]);pen=true;}else arcX.lineTo(P[0],P[1]);}
      if(pass===0){arcX.strokeStyle="rgba(255,214,10,.22)";arcX.lineWidth=7*dpr;}else{arcX.strokeStyle="rgba(255,226,120,.95)";arcX.lineWidth=1.8*dpr;}
      arcX.stroke();
    }
    var last=pts[pts.length-1];
    if(last&&pi<1){arcX.beginPath();arcX.fillStyle="#fff";arcX.arc(last[0],last[1],3*dpr,0,7);arcX.fill();}
  }
}

/* 读 JPEG 里的 EXIF：拍摄时间和 GPS（只在本机读取，用来匹配城市，不会上传坐标） */

function tiffRead(dv,t,end){

/* MP4/MOV：读时长、拍摄时间和位置（ISO 6709 文本），并把文件里的位置改成全零后再上传 */
function mp4Scan(buf){
  var dv=new DataView(buf),n=buf.byteLength,o=0,out={};
  while(o+8<=n){
    var sz=dv.getUint32(o),ty=String.fromCharCode(dv.getUint8(o+4),dv.getUint8(o+5),dv.getUint8(o+6),dv.getUint8(o+7)),hs=8;
    if(sz===1){if(o+16>n)break;sz=dv.getUint32(o+8)*4294967296+dv.getUint32(o+12);hs=16;}else if(sz===0)sz=n-o;
    if(sz<hs)break;
    if(ty==="moov")moov(o+hs,Math.min(n,o+sz));
    o+=sz;
  }
  function moov(a,b){
    var p=a;
    while(p+8<=b){
      var s=dv.getUint32(p),t=String.fromCharCode(dv.getUint8(p+4),dv.getUint8(p+5),dv.getUint8(p+6),dv.getUint8(p+7));
      if(s<8)break;
      if(t==="mvhd"){
        var v=dv.getUint8(p+8),ct,ts,du;
        if(v===1){ct=dv.getUint32(p+12)*4294967296+dv.getUint32(p+16);ts=dv.getUint32(p+28);du=dv.getUint32(p+32)*4294967296+dv.getUint32(p+36);}
        else{ct=dv.getUint32(p+12);ts=dv.getUint32(p+20);du=dv.getUint32(p+24);}
        if(ts)out.dur=du/ts;
        if(ct>2082844800+86400*365*20)out.created=new Date((ct-2082844800)*1000).toISOString();
      }
      p+=s;
    }
    var bytes=new Uint8Array(buf,a,b-a),str="";
    for(var i=0;i<bytes.length;i+=32768)str+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(bytes.length,i+32768)));
    var re=/([+-]\d{2}(?:\.\d+)?)([+-]\d{3}(?:\.\d+)?)([+-]\d+(?:\.\d+)?)?(?:CRS[^\/]{0,24})?\//g,m;
    while((m=re.exec(str))){
      var la=parseFloat(m[1]),lo=parseFloat(m[2]);
      if(out.lat===undefined&&Math.abs(la)<=90&&Math.abs(lo)<=180&&(la||lo)){out.lat=la;out.lng=lo;}
      for(var j=0;j<m[0].length;j++){var ch=m[0].charCodeAt(j);if(ch>=48&&ch<=57)bytes[m.index+j]=48;}
      out.stripped=true;
    }
  }
  return out;
}
function videoPoster(file){
  return new Promise(function(res){
    var u=URL.createObjectURL(file),v=document.createElement("video"),done=false;
    function fin(r){if(done)return;done=true;clearTimeout(tm);try{v.pause();v.removeAttribute("src");v.load();}catch(e){}URL.revokeObjectURL(u);res(r);}
    var tm=setTimeout(function(){fin(null);},9000);
    v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";
    v.onloadedmetadata=function(){try{v.currentTime=Math.min(0.5,(v.duration||1)/3);}catch(e){}};
    v.onseeked=function(){
      var w=v.videoWidth,h=v.videoHeight;
      if(!w){fin({dur:v.duration});return;}
      toJpeg(v,w,h,720,0.8).then(function(t){fin({blob:t.blob,tw:t.w,th:t.h,w:w,h:h,dur:v.duration});},function(){fin({w:w,h:h,dur:v.duration});});
    };
    v.onerror=function(){fin(null);};
    v.src=u;
  });
}
/* 视频读不出画面时（例如电脑上的 Chrome 不支持 HEVC），生成一张简单的封面 */
function plainPoster(){
  var c=document.createElement("canvas");c.width=640;c.height=400;var x=c.getContext("2d");
  var g=x.createLinearGradient(0,0,640,400);g.addColorStop(0,"#2b3a55");g.addColorStop(1,"#0e1420");x.fillStyle=g;x.fillRect(0,0,640,400);
  x.fillStyle="rgba(255,255,255,.9)";x.beginPath();x.moveTo(296,168);x.lineTo(296,232);x.lineTo(350,200);x.closePath();x.fill();
  return new Promise(function(r){c.toBlob(function(b){r({blob:b,tw:640,th:400});},"image/jpeg",0.8);});
}
function vidType(f){
  var t=(f.type||"").toLowerCase(),e=(/\.(\w+)$/.exec(f.name||"")||[])[1];e=e&&e.toLowerCase();
  if(t==="video/mp4"||e==="mp4"||e==="m4v")return ["video/mp4","mp4"];
  if(t==="video/quicktime"||e==="mov")return ["video/quicktime","mov"];
  if(t==="video/webm"||e==="webm")return ["video/webm","webm"];
  return null;
}

var UP={items:[],preset:null,pub:false,cat:null,cap:"",busy:false,phase:"edit",pick:null,q:Promise.resolve(),lastCity:null};
function upStart(preset,noPick){
  /* 登录后接着打开上传窗口；这时已不在用户点击的瞬间，浏览器可能不允许直接弹出选文件，所以只显示“选择照片”按钮 */
  if(!needLogin(function(){upStart(preset,true);}))return;
  if(UP.busy){upOpen();return;}
  if(!UP.items.length||UP.phase==="done"){upReset();}
  UP.preset=preset||UP.preset;
  upOpen();
  if(!noPick){var f=$("#upFile");f.value="";f.click();}
  loadPlaces().catch(function(){});
}
function upReset(){
  UP.items.forEach(function(it){if(it.prev)URL.revokeObjectURL(it.prev);});
  UP.items=[];UP.cap="";UP.phase="edit";UP.pick=null;UP.preset=null;UP.pub=false;UP.cat=null;
}
function upOpen(){
  mOpen("up",upHTML(),{wide:true,guard:function(){
    if(UP.busy)return false;
    if(UP.phase==="edit"&&UP.items.length&&!confirm(tr("upLeave")))return false;
    upReset();return true;
  }});
}
$("#upFile").addEventListener("change",function(){var fs=Array.prototype.slice.call(this.files||[]);if(fs.length)upAddFiles(fs);});
function upAddFiles(files){
  if(UP.phase!=="edit")return;
  var room=30-UP.items.length;
  if(files.length>room){toast(tr("upMax"));files=files.slice(0,Math.max(0,room));}
  files.forEach(function(f){
    var it={id:uuid(),file:f,kind:/^video\//.test(f.type)||vidType(f)&&!/^image\//.test(f.type)?"video":"photo",st:"prep",prog:0,cityId:null};
    UP.items.push(it);
    UP.q=UP.q.then(function(){return prep(it).then(function(){it.st=it.err?"err":"ready";assignCity(it);},function(e){it.st="err";it.err=it.err||tr("upBadFmt");}).then(upRefresh);});
  });
  upRefresh();
}
function prep(it){
  var f=it.file;
  if(it.kind==="photo"){
    if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|webp|gif|heic|heif|avif)$/i.test(f.name||"")){it.err=tr("upBadType");return Promise.resolve();}
    return f.slice(0,262144).arrayBuffer().then(function(b){
      var ex=exifRead(b)||{};it.lat=ex.lat;it.lng=ex.lng;it.taken=exifDate(ex.dt);
      return loadImg(f);
    }).then(function(r){
      var w=r.im.naturalWidth,h=r.im.naturalHeight;
      return toJpeg(r.im,w,h,2048,0.82).then(function(full){
        return toJpeg(r.im,w,h,640,0.78).then(function(th){
          URL.revokeObjectURL(r.u);
          it.full=full.blob;it.thumb=th.blob;it.w=full.w;it.h=full.h;it.type="image/jpeg";it.ext="jpg";it.prev=URL.createObjectURL(th.blob);
        });
      });
    });
  }
  var vt=vidType(f);
  if(!vt){it.err=tr("upBadType");return Promise.resolve();}
  if(f.size>50*1024*1024){it.err=tr("upTooBig");return Promise.resolve();}
  it.type=vt[0];it.ext=vt[1];
  return f.arrayBuffer().then(function(buf){
    var s=mp4Scan(buf);it.lat=s.lat;it.lng=s.lng;it.taken=s.created||null;it.dur=s.dur;
    it.full=new Blob([buf],{type:vt[0]});
    return videoPoster(it.full);
  }).then(function(p){
    if(p&&p.dur&&isFinite(p.dur))it.dur=p.dur;
    if(it.dur>61){it.err=tr("upTooLong");return;}
    if(p&&p.w){it.w=p.w;it.h=p.h;}
    return (p&&p.blob?Promise.resolve(p):plainPoster()).then(function(t){
      it.thumb=t.blob;if(!it.w){it.w=t.tw;it.h=t.th;}it.prev=URL.createObjectURL(t.blob);
    });
  });
}
function assignCity(it){
  if(it.err||it.cityId)return;
  if(it.lat!==undefined&&C.P){var c=nearPlaces(it.lat,it.lng,1)[0];if(c){it.cityId=c.p.id;return;}}
  if(it.lat!==undefined&&!C.P){loadPlaces().then(function(){assignCity(it);upRefresh();});return;}
  if(UP.preset)it.cityId=UP.preset;
}
function upGroups(){
  var g={},order=[];
  UP.items.forEach(function(it){var k=it.err?"!err":it.st==="prep"?"!prep":(it.cityId||"!none");if(!g[k]){g[k]=[];order.push(k);}g[k].push(it);});
  order.sort(function(a,b){return (a[0]==="!")-(b[0]==="!")||g[b].length-g[a].length;});
  return order.map(function(k){return {k:k,items:g[k]};});
}

mcard.addEventListener("click",function(e){

  var rm=t.closest("[data-rm]");
  if(rm){var id=rm.getAttribute("data-rm");UP.items=UP.items.filter(function(it){if(it.id===id&&it.prev)URL.revokeObjectURL(it.prev);return it.id!==id;});upRefresh();return;}
  var gp=t.closest("[data-grp]");
  if(gp){var k=gp.getAttribute("data-grp");UP.pick={grp:k,ids:UP.items.filter(function(it){return !it.err&&it.st!=="prep"&&(it.cityId||"!none")===k;}).map(function(it){return it.id;}),q:""};upRefresh();pickFocus();return;}
  var it=t.closest("[data-it]");
  if(it&&UP.phase==="edit"&&!t.closest("[data-rm]")){
    var item=UP.items.filter(function(x){return x.id===it.getAttribute("data-it");})[0];
    if(item&&!item.err&&item.st!=="prep")popMenu(it,[{t:tr("moveTo"),fn:function(){UP.pick={grp:null,ids:[item.id],q:""};upRefresh();pickFocus();}},{t:tr("remove"),red:true,fn:function(){UP.items=UP.items.filter(function(x){return x!==item;});upRefresh();}}]);

  }
  if(t.closest("#pkBack")){UP.pick=null;upRefresh();}
});

/* 上传：用 XHR 直接传到存储，能显示进度 */
function xhrUp(bucket,path,blob,type,onp){
  return C.sb.auth.getSession().then(function(r){
    var tok=r.data&&r.data.session&&r.data.session.access_token;if(!tok)throw new Error("auth");
    return new Promise(function(res,rej){
      var x=new XMLHttpRequest();
      x.open("POST",CFG.url+"/storage/v1/object/"+bucket+"/"+path);
      x.setRequestHeader("Authorization","Bearer "+tok);x.setRequestHeader("apikey",CFG.key);
      x.setRequestHeader("Content-Type",type);x.setRequestHeader("x-upsert","false");x.setRequestHeader("cache-control","max-age=3600");
      x.upload.onprogress=function(e){if(e.lengthComputable&&onp)onp(e.loaded/e.total);};
      x.onload=function(){if(x.status<300)res();else{var m="";try{m=JSON.parse(x.responseText).message;}catch(er){}rej(new Error(m||("HTTP "+x.status)));}};
      x.onerror=function(){rej(new Error("network"));};
      x.send(blob);
    });
  });
}
function upPublish(){
  var list=UP.items.filter(function(it){return it.st==="ready"&&it.cityId;});

function fpFit(){
  var L=C.fp.list;if(!L.length)return;
  var s=[0,0,0];L.forEach(function(q){var v=llv(q.lat,q.lon);s[0]+=v[0];s[1]+=v[1];s[2]+=v[2];});
  var n=Math.hypot(s[0],s[1],s[2])||1,c=[s[0]/n,s[1]/n,s[2]/n],mx2=0;
  L.forEach(function(q){var v=llv(q.lat,q.lon);mx2=Math.max(mx2,Math.acos(clamp(v[0]*c[0]+v[1]*c[1]+v[2]*c[2],-1,1))/RAD);});
  var lat=Math.asin(clamp(c[1],-1,1))/RAD,lon=Math.atan2(-c[2],c[0])/RAD;
  var z=mx2<3?3.4:mx2<8?2.6:mx2<20?1.8:mx2<40?1.25:1;
  if(!S.started)startApp();
  flyTo(lat,lon,z);S.hold=true;
}

        (x.kind!=="media"&&x.preview?'<span class="q">'+esc(x.preview)+'</span>':"")+'<small>'+esc(g.rs.join(" / "))+' · '+ago(x.created_at)+'</small><div class="bt">'+
        (x.kind==="media"?'<button type="button" class="mbtn sm" data-ad="hide">'+tr("hide")+'</button>':"")+
        (x.kind==="media"&&x.hidden?'<button type="button" class="mbtn sec sm" data-ad="unhide">'+tr("unhide")+'</button>':"")+
        '<button type="button" class="mbtn sec sm" data-ad="dismiss">'+tr("admDismiss")+'</button>'+
        (x.owner?'<button type="button" class="mbtn red sm" data-ad="ban">'+tr("banUser")+'</button>':"")+'</div></div></div>';
    }).join("");
  }).catch(function(e){var l=$("#admL");if(l)l.innerHTML='<div class="pf-empty">'+esc(errText(e))+'</div>';});
}
mcard.addEventListener("click",function(e){
  if(M.kind!=="adm")return;
  var b=e.target.closest("[data-ad]");if(!b)return;
  var it=b.closest(".adm-it"),k=it.getAttribute("data-k"),t=it.getAttribute("data-t"),o=it.getAttribute("data-o"),a=b.getAttribute("data-ad");
  var q=a==="hide"?C.sb.rpc("admin_set_hidden",{k:k,t:t,h:true}):a==="unhide"?C.sb.rpc("admin_set_hidden",{k:k,t:t,h:false}):
        a==="dismiss"?C.sb.rpc("admin_dismiss",{k:k,t:t}):a==="ban"?(confirm(tr("banUser")+"?")?C.sb.rpc("admin_ban",{uid:o,b:true}):null):null;
  if(!q)return;
  q.then(function(r){if(r.error)toast(errText(r.error));else{it.remove();loadOverview();if(!$("#admL").children.length)$("#admL").innerHTML='<div class="pf-empty">'+tr("admEmpty")+'</div>';}});
});

/* ---------- 文档：隐私政策、用户协议、社区规则 ---------- */
function docOpen(k,back){
  var d=(window.ATLAS_DOCS||{})[LANG]||{};var html=d[k];if(!html)return;
  var prev=back&&M.kind==="auth";
  mOpen("doc",mx()+'<div class="doc">'+html+'</div>',{wide:true,onclose:prev?function(){setTimeout(function(){mOpen("auth",authHTML());},360);}:null});
}

/* ---------- 地址栏：分享链接 ---------- */
function setHash(h){try{history.replaceState(null,"",h?"#"+h:location.pathname+location.search);}catch(e){}}
function mediaOpen(id){
  C.sb.from("media").select(MCOLS).eq("id",id).maybeSingle().then(function(r){
    var m=must(r);if(!m){toast(tr("loadErr"));return;}
    loadPlaces().catch(function(){}).then(function(){
      if(!C.PI[m.city_id]&&!C.ovById[m.city_id])C.ovById[m.city_id]={city_id:m.city_id,city_zh:m.city_zh,city_en:m.city_en,cc:m.cc,clat:m.clat,clng:m.clng};
      goPlace(m.city_id);
      return signFor([m],["thumb","path"]).then(function(){setTimeout(function(){lbOpen([m],0,"link");},500);});
    });
  }).catch(function(){toast(tr("loadErr"));});
}
function route(){
  var h=decodeURIComponent(location.hash.slice(1)),m;
  if(!h)return;
  if((m=/^c\/([\w-]{1,80})$/.exec(h)))openPlace(m[1]);
  else if(!cOK())return;
  else if(h==="me")(meP||Promise.resolve()).then(function(){if(C.me)profileOpen();});
  else if(h==="map")(meP||Promise.resolve()).then(function(){if(C.me)fpOpen();});
  else if((m=/^m\/([0-9a-f-]{36})$/.exec(h)))mediaOpen(m[1]);
  else if((m=/^doc\/(\w+)$/.exec(h)))docOpen(m[1]);
}
window.addEventListener("hashchange",route);

/* ---------- 国家卡片：列出有照片的城市 ---------- */
function countryComm(name){
  var cc=null;
  Object.keys(C.CC).some(function(k){var c=C.CC[k];if(c[0]===name||c[1]===(COUNTRY_EN[name]||name)){cc=k;return true;}return false;});
  var list=cc?pinSource().filter(function(q){return q.cc===cc;}):[];
  if(!list.length)return '<p class="info">'+tr("ctyNone")+'</p>';
  return '<p class="eyebrow" style="padding:0 4px">'+esc(tr("ctyN")(list.length))+'</p><div class="clist">'+list.slice(0,60).map(function(q){
    return '<button type="button" class="ccard" data-open-city="'+esc(q.id)+'"><span class="av" style="width:44px;height:44px;border-radius:10px">'+(q.img?'<img src="'+esc(q.img)+'" alt="" loading="lazy">':"")+'</span><span><b>'+esc(q.name)+'</b><small>'+q.n+' · '+tr("photo")+'</small></span>'+ICN.chev+'</button>';
  }).join("")+'</div>';
}

/* ---------- 键盘 ---------- */
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if(popEl){closePop();e.stopImmediatePropagation();return;}
    if(lbOn()){lbClose();e.stopImmediatePropagation();return;}
    if(mOn()){mClose();e.stopImmediatePropagation();return;}
  }
  if(lbOn()){if(e.key==="ArrowLeft"){lbMove(-1);e.stopImmediatePropagation();}else if(e.key==="ArrowRight"){lbMove(1);e.stopImmediatePropagation();}}
},true);

/* ---------- 启动 ---------- */
function commInit(){
  initSB();acctBtnRender();renderAcct();
  $("#upBtn").addEventListener("click",function(){upStart(null);});
  hitEl.querySelector("span").addEventListener("click",function(){if(S.hit&&S.hit.cid)openPlace(S.hit.cid);});
  if(!cOK())return;
  loadMe();
}
function commReady(){
  loadPlaces().catch(function(){});
  loadCurated();
  if(cOK())loadOverview();
  if(location.hash.length>2){startApp();setTimeout(route,reduced()?0:900);}
}


applyLang();

/* ---------- 启动 ---------- */
function boot(){
  document.body.classList.add("loading");
  commInit();
  resize();
  try{initGL();}catch(err){$("#fallback").hidden=false;$("#loading").hidden=true;return;}
  buildLabels();
  var sp=sunPos(Date.now());
  S.lat=22;S.lon=wrap(sp.lon+40);
  glc.addEventListener("webglcontextlost",function(e){e.preventDefault();});
  var small=S.small=Math.min(screen.width||9999,screen.height||9999)<760||/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent||"");
  try{initSky();}catch(err){SKY.ok=false;}
  Promise.all([
    /* 先用 4K 贴图尽快显示地球；电脑上随后在后台换成 8K */
    loadTex(TEX.day4||TEX.day,0,TEX.day4||small?4096:8192,false,function(w,h,im){tileThumb(im);}).then(function(t){S.tDay=t;return t;}),
    loadTex(TEX.night4||TEX.night,1,TEX.day4||small?4096:8192,true).then(function(t){S.tNight=t;return t;}),
    loadTex(TEX.water,2,small?2048:4096,"la"),
    loadTex(TEX.height,3,small?2048:4096,true,function(w,h){S.htx=1/w;S.hty=1/h;}),
    loadTex(TEX.sky,5,small?2048:4096,false,null,true)
  ]).then(function(){
    S.ready=true;document.body.classList.remove("loading");
    S.last=performance.now();requestAnimationFrame(render);
    commReady();
    var cn=navigator.connection||{};
    if(!small&&TEX.day4&&!cn.saveData&&!/(^|-)2g$/.test(cn.effectiveType||"")&&(gl.getParameter(gl.MAX_TEXTURE_SIZE)||0)>=8192)setTimeout(texUpgrade,1200);
  }).catch(function(){$("#fallback").hidden=false;$("#loading").hidden=true;});
}
function texUpgrade(){
  function swap(src,unit,lum,key){
    return loadTex(src,unit,8192,lum).then(function(t){var old=S[key];S[key]=t;if(old&&old!==t)gl.deleteTexture(old);}).catch(function(){});
  }
  swap(TEX.day,0,false,"tDay").then(function(){return swap(TEX.night,1,true,"tNight");});
}
boot();
if(/[?&]debug\b/.test(location.search)){window.__atlas={S:S,BW:BW,CV:CV,SL:SL,TL:TL,C:C,CVC:CVC,UP:UP,LB:LB,LABS:function(){return LABS;}};var mt=/[?&]tiles=([^&]+)/.exec(location.search);if(mt)TL.src=decodeURIComponent(mt[1]);}
})();
</script>
